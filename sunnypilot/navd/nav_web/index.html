<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FunnyPilot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    #topbar h1 {
      font-size: 15px;
      font-weight: 700;
      color: #e94560;
      flex: 1;
      letter-spacing: 0.3px;
    }
    #conn-status {
      font-size: 11px;
      color: #555;
    }
    #conn-status.on  { color: #2ecc71; }
    #conn-status.off { color: #e74c3c; }

    #flash-btn {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    #flash-btn:active { background: #c0392b; }

    /* ── Terminal ── */
    #terminal-container { flex: 1; padding: 4px; overflow: hidden; min-height: 0; }

    /* ── Modal overlay ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    #modal-overlay.active { display: flex; }

    /* ── Modal sheet ── */
    #modal {
      background: #1c1c1c;
      border-radius: 14px 14px 0 0;
      padding: 20px 16px 32px;
      width: 100%;
      max-width: 520px;
      max-height: 80dvh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #modal h2 {
      font-size: 16px;
      font-weight: 700;
      color: #eee;
    }
    #modal-close {
      background: #2a2a2a;
      border: none;
      color: #888;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #modal-close:active { background: #333; }

    /* ── Branch list ── */
    #branch-list {
      flex: 1;
      overflow-y: auto;
      border-radius: 8px;
      background: #141414;
      border: 1px solid #2a2a2a;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .branch-item {
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      border-bottom: 1px solid #1f1f1f;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
      user-select: none;
    }
    .branch-item:last-child { border-bottom: none; }
    .branch-item:active { background: #222; }
    .branch-item.selected {
      background: #1e2a1e;
      border-left: 3px solid #2ecc71;
    }
    .branch-item.selected .branch-name { color: #2ecc71; }

    .branch-name {
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
      word-break: break-all;
    }
    .branch-date {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }

    .branch-loading {
      padding: 20px 14px;
      color: #555;
      font-size: 13px;
      text-align: center;
    }

    /* ── Modal actions ── */
    #modal-actions {
      display: flex;
      gap: 10px;
    }
    .btn-primary {
      flex: 1;
      background: #e94560;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { background: #c0392b; }
    .btn-primary:disabled { background: #5a1e2a; color: #888; cursor: default; }

    #modal-status {
      font-size: 12px;
      color: #888;
      min-height: 16px;
      text-align: center;
    }
    #modal-status.ok  { color: #2ecc71; }
    #modal-status.err { color: #e74c3c; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>FunnyPilot</h1>
  <span id="conn-status">connecting</span>
  <button id="flash-btn" onclick="openFlashModal()">Flash</button>
</div>

<div id="terminal-container"></div>

<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <h2>Flash Branch</h2>
      <button id="modal-close" onclick="closeFlashModal()">✕</button>
    </div>

    <div id="branch-list">
      <div class="branch-loading">Loading branches…</div>
    </div>

    <div id="modal-actions">
      <button class="btn-primary" id="flash-confirm" onclick="doFlash()" disabled>Flash &amp; Reboot</button>
    </div>
    <div id="modal-status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
  // ── Terminal ──────────────────────────────────────────────────────────────
  const term = new Terminal({
    theme: { background: '#111', foreground: '#ddd', cursor: '#e94560' },
    fontSize: 13,
    fontFamily: '"Cascadia Code", "Fira Code", monospace',
    cursorBlink: true,
    scrollback: 5000,
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal-container'));
  fitAddon.fit();
  window.addEventListener('resize', () => fitAddon.fit());

  // ── WebSocket ─────────────────────────────────────────────────────────────
  let ws = null;
  let reconnectTimer = null;

  function connect() {
    clearTimeout(reconnectTimer);
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      const s = document.getElementById('conn-status');
      s.textContent = 'connected';
      s.className = 'on';
      sendResize();
    };
    ws.onmessage = (e) => {
      term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data);
    };
    ws.onclose = () => {
      const s = document.getElementById('conn-status');
      s.textContent = 'disconnected';
      s.className = 'off';
      reconnectTimer = setTimeout(connect, 3000);
    };
    ws.onerror = () => ws.close();
  }

  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const buf = new Uint8Array(5);
    buf[0] = 0xFF;
    buf[1] = term.cols & 0xFF;  buf[2] = (term.cols >> 8) & 0xFF;
    buf[3] = term.rows & 0xFF;  buf[4] = (term.rows >> 8) & 0xFF;
    ws.send(buf);
  }

  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(new TextEncoder().encode(data));
  });
  term.onResize(sendResize);
  connect();

  // ── Flash modal ───────────────────────────────────────────────────────────
  let selectedBranch = null;

  function openFlashModal() {
    selectedBranch = null;
    document.getElementById('flash-confirm').disabled = true;
    document.getElementById('modal-status').textContent = '';
    document.getElementById('modal-status').className = '';
    document.getElementById('modal-overlay').classList.add('active');
    loadBranches();
  }

  function closeFlashModal() {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  async function loadBranches() {
    const list = document.getElementById('branch-list');
    list.innerHTML = '<div class="branch-loading">Loading…</div>';
    try {
      const branches = await fetch('/api/branches').then(r => r.json());
      list.innerHTML = '';
      if (!branches.length) {
        list.innerHTML = '<div class="branch-loading">No branches found</div>';
        return;
      }
      for (const b of branches) {
        const item = document.createElement('div');
        item.className = 'branch-item';
        item.dataset.name = b.name;
        const date = b.date ? b.date.slice(0, 10) : '';
        item.innerHTML =
          `<span class="branch-name">${b.name}</span>` +
          (date ? `<span class="branch-date">${date}</span>` : '');
        item.addEventListener('click', () => selectBranch(b.name));
        list.appendChild(item);
      }
    } catch (e) {
      list.innerHTML = `<div class="branch-loading">Error: ${e.message}</div>`;
    }
  }

  function selectBranch(name) {
    selectedBranch = name;
    document.querySelectorAll('.branch-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.name === name);
    });
    document.getElementById('flash-confirm').disabled = false;
  }

  async function doFlash() {
    if (!selectedBranch) return;
    const statusEl = document.getElementById('modal-status');
    const btn = document.getElementById('flash-confirm');
    btn.disabled = true;
    statusEl.textContent = `Flashing ${selectedBranch}…`;
    statusEl.className = '';
    try {
      const resp = await fetch('/api/flash', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branch: selectedBranch }),
      });
      const data = await resp.json();
      if (resp.ok) {
        statusEl.textContent = 'Flashing — device will reboot shortly.';
        statusEl.className = 'ok';
        setTimeout(closeFlashModal, 3000);
      } else {
        statusEl.textContent = data.error || 'Flash failed';
        statusEl.className = 'err';
        btn.disabled = false;
      }
    } catch (e) {
      statusEl.textContent = e.message;
      statusEl.className = 'err';
      btn.disabled = false;
    }
  }

  // Close on backdrop tap
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) closeFlashModal();
  });
</script>
</body>
</html>
