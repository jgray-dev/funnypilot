<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>comma terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0d0d0d; overflow: hidden; }
    #header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px; color: #888;
      user-select: none;
    }
    #header .dot { width: 12px; height: 12px; border-radius: 50%; }
    #header .dot.red   { background: #ff5f57; }
    #header .dot.yellow{ background: #febc2e; }
    #header .dot.green { background: #28c840; }
    #header .title { color: #ccc; margin-left: 8px; }
    #status { margin-left: auto; font-size: 12px; }
    #status.ok  { color: #28c840; }
    #status.err { color: #ff5f57; }
    #terminal-wrap { width: 100%; height: calc(100vh - 37px); padding: 6px; }
    .xterm { height: 100%; }
    .xterm-viewport { border-radius: 4px; }
  </style>
</head>
<body>
  <div id="header">
    <div class="dot red"></div>
    <div class="dot yellow"></div>
    <div class="dot green"></div>
    <span class="title">comma terminal — <span id="host"></span></span>
    <span id="status" class="ok">connecting…</span>
  </div>
  <div id="terminal-wrap">
    <div id="terminal"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const hostEl   = document.getElementById('host');
    hostEl.textContent = location.hostname;

    const term = new Terminal({
      cursorBlink: true,
      fontFamily: '"Cascadia Code", "Fira Code", "JetBrains Mono", "Menlo", monospace',
      fontSize: 14,
      lineHeight: 1.2,
      theme: {
        background:   '#0d0d0d',
        foreground:   '#d4d4d4',
        cursor:       '#aeafad',
        black:        '#1e1e1e', brightBlack:   '#555',
        red:          '#f44747', brightRed:     '#f97583',
        green:        '#6a9955', brightGreen:   '#b5cea8',
        yellow:       '#d7ba7d', brightYellow:  '#e9c46a',
        blue:         '#569cd6', brightBlue:    '#9cdcfe',
        magenta:      '#c678dd', brightMagenta: '#d4a5f5',
        cyan:         '#4ec9b0', brightCyan:    '#56b6c2',
        white:        '#d4d4d4', brightWhite:   '#ffffff',
      },
      allowProposedApi: true,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal'));
    fitAddon.fit();

    let ws = null;
    let reconnectTimer = null;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.binaryType = 'arraybuffer';

      ws.onopen = () => {
        statusEl.textContent = 'connected';
        statusEl.className = 'ok';
        sendResize();
      };

      ws.onmessage = (e) => {
        term.write(new Uint8Array(e.data));
      };

      ws.onclose = () => {
        statusEl.textContent = 'disconnected — reconnecting…';
        statusEl.className = 'err';
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        ws.close();
      };
    }

    function sendResize() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
      }
    }

    term.onData(data => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(new TextEncoder().encode(data));
      }
    });

    window.addEventListener('resize', () => {
      fitAddon.fit();
      sendResize();
    });

    term.onResize(({ cols, rows }) => sendResize());

    connect();
  </script>
</body>
</html>
