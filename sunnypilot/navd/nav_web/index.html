<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>FunnyPilot</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #ddd;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    #topbar h1 {
      font-size: 15px;
      font-weight: 700;
      color: #e94560;
      flex: 1;
      letter-spacing: 0.3px;
    }
    #conn-status {
      font-size: 11px;
      color: #555;
    }
    #conn-status.on  { color: #2ecc71; }
    #conn-status.off { color: #e74c3c; }

    #flash-btn {
      background: #e94560;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    #flash-btn:active { background: #c0392b; }

    #diag-btn {
      background: #2a2f3a;
      color: #cdd6e0;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    #diag-btn:active { background: #1f242c; }

    /* ── Diagnostics modal ── */
    #diag-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    #diag-overlay.active { display: flex; }
    #diag-modal {
      background: #1c1c1c;
      border-radius: 14px 14px 0 0;
      padding: 20px 16px 32px;
      width: 100%;
      max-width: 520px;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #diag-list {
      flex: 1;
      overflow-y: auto;
      border-radius: 8px;
      background: #141414;
      border: 1px solid #2a2a2a;
      min-height: 60px;
      -webkit-overflow-scrolling: touch;
    }
    .diag-row { padding: 10px 12px; border-bottom: 1px solid #1f1f1f; }
    .diag-row:last-child { border-bottom: none; }
    .diag-head { display: flex; align-items: center; gap: 8px; }
    .diag-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.4px;
      padding: 3px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      min-width: 48px;
      text-align: center;
    }
    .diag-pill.pass { background: #16361f; color: #2ecc71; }
    .diag-pill.fail { background: #3a1518; color: #e74c3c; }
    .diag-pill.warn { background: #3a2f12; color: #f1c40f; }
    .diag-pill.info { background: #20262e; color: #7f8c9a; }
    .diag-name { font-size: 13px; color: #ddd; font-weight: 500; flex: 1; word-break: break-word; }
    .diag-summary { font-size: 11px; color: #888; text-align: right; word-break: break-word; }
    .diag-output {
      margin-top: 6px;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 11px;
      color: #9aa4ad;
      white-space: pre-wrap;
      word-break: break-all;
      background: #0e0e0e;
      border-radius: 5px;
      padding: 7px 9px;
      max-height: 150px;
      overflow-y: auto;
    }
    .diag-cmd { color: #5a6470; }
    .btn-secondary {
      flex: 1;
      background: #2a2f3a;
      color: #cdd6e0;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-secondary:active { background: #1f242c; }
    .btn-secondary:disabled { background: #1a1d22; color: #555; cursor: default; }
    #diag-status { font-size: 12px; color: #888; min-height: 16px; text-align: center; }
    #diag-status.ok  { color: #2ecc71; }
    #diag-status.err { color: #e74c3c; }

    /* ── Triage logs modal (v3.2.7) ── */
    #logs-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    #logs-overlay.active { display: flex; }
    #logs-modal {
      background: #1c1c1c;
      border-radius: 14px 14px 0 0;
      padding: 20px 16px 32px;
      width: 100%;
      max-width: 520px;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #logs-files { display: flex; gap: 8px; flex-wrap: wrap; }
    .log-file-btn {
      background: #2a2f3a;
      color: #cdd6e0;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      -webkit-tap-highlight-color: transparent;
    }
    .log-file-btn.selected { background: #e94560; color: #fff; }
    #logs-view {
      flex: 1;
      overflow-y: auto;
      font-family: "Cascadia Code", "Fira Code", monospace;
      font-size: 10.5px;
      color: #9aa4ad;
      white-space: pre-wrap;
      word-break: break-all;
      background: #0e0e0e;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 120px;
      -webkit-overflow-scrolling: touch;
    }
    #mark-btn {
      background: #7a3ce8;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      flex: 1;
      -webkit-tap-highlight-color: transparent;
    }
    #mark-btn:active { background: #6430c0; }
    #logs-status { font-size: 12px; color: #888; min-height: 16px; text-align: center; }
    #logs-status.ok  { color: #2ecc71; }
    #logs-status.err { color: #e74c3c; }

    /* ── Terminal ── */
    #terminal-container { flex: 1; padding: 4px; overflow: hidden; min-height: 0; }

    /* ── Modal overlay ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }
    #modal-overlay.active { display: flex; }

    /* ── Modal sheet ── */
    #modal {
      background: #1c1c1c;
      border-radius: 14px 14px 0 0;
      padding: 20px 16px 32px;
      width: 100%;
      max-width: 520px;
      max-height: 80dvh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #modal-header, #diag-mheader, #logs-mheader {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    #modal h2, #diag-modal h2, #logs-modal h2 {
      font-size: 16px;
      font-weight: 700;
      color: #eee;
    }
    #modal-close, #diag-close, #logs-close {
      background: #2a2a2a;
      border: none;
      color: #888;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    #modal-close:active, #diag-close:active, #logs-close:active { background: #333; }

    /* ── Branch list ── */
    #branch-list {
      flex: 1;
      overflow-y: auto;
      border-radius: 8px;
      background: #141414;
      border: 1px solid #2a2a2a;
      min-height: 0;
      -webkit-overflow-scrolling: touch;
    }

    .branch-item {
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      border-bottom: 1px solid #1f1f1f;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.1s;
      user-select: none;
    }
    .branch-item:last-child { border-bottom: none; }
    .branch-item:active { background: #222; }
    .branch-item.selected {
      background: #1e2a1e;
      border-left: 3px solid #2ecc71;
    }
    .branch-item.selected .branch-name { color: #2ecc71; }

    .branch-name {
      font-size: 14px;
      font-weight: 500;
      color: #ddd;
      word-break: break-all;
    }
    .branch-date {
      font-size: 11px;
      color: #555;
      margin-top: 2px;
    }

    .branch-loading {
      padding: 20px 14px;
      color: #555;
      font-size: 13px;
      text-align: center;
    }

    /* ── Modal actions ── */
    #modal-actions, #diag-actions, #logs-actions {
      display: flex;
      gap: 10px;
    }
    .btn-primary {
      flex: 1;
      background: #e94560;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary:active { background: #c0392b; }
    .btn-primary:disabled { background: #5a1e2a; color: #888; cursor: default; }

    #modal-status {
      font-size: 12px;
      color: #888;
      min-height: 16px;
      text-align: center;
    }
    #modal-status.ok  { color: #2ecc71; }
    #modal-status.err { color: #e74c3c; }
  </style>
</head>
<body>

<div id="topbar">
  <h1>FunnyPilot</h1>
  <span id="conn-status">connecting</span>
  <button id="logs-btn" class="btn-secondary" style="flex:none;padding:7px 14px;font-size:13px;" onclick="openLogsModal()">Logs</button>
  <button id="diag-btn" onclick="openDiagModal()">Verify</button>
  <button id="flash-btn" onclick="openFlashModal()">Flash</button>
</div>

<div id="terminal-container"></div>

<div id="modal-overlay">
  <div id="modal">
    <div id="modal-header">
      <h2>Flash Branch</h2>
      <button id="modal-close" onclick="closeFlashModal()">✕</button>
    </div>

    <div id="branch-list">
      <div class="branch-loading">Loading branches…</div>
    </div>

    <div id="modal-actions">
      <button class="btn-primary" id="flash-confirm" onclick="doFlash()" disabled>Flash &amp; Reboot</button>
    </div>
    <div id="modal-status"></div>
  </div>
</div>

<div id="diag-overlay">
  <div id="diag-modal">
    <div id="diag-mheader">
      <h2>Code Verification</h2>
      <button id="diag-close" onclick="closeDiagModal()">✕</button>
    </div>

    <div id="diag-list">
      <div class="branch-loading">Running checks…</div>
    </div>

    <div id="diag-actions">
      <button class="btn-secondary" id="diag-copy" onclick="copyDiag()" disabled>Copy Output</button>
      <button class="btn-primary" id="diag-run" onclick="runDiag()">Run Again</button>
    </div>
    <div id="diag-status"></div>
  </div>
</div>

<div id="logs-overlay">
  <div id="logs-modal">
    <div id="logs-mheader">
      <h2>Triage Logs</h2>
      <button id="logs-close" onclick="closeLogsModal()">✕</button>
    </div>

    <div id="logs-files"><span class="branch-loading">Loading…</span></div>
    <div id="logs-view">Select a log file above. lat_interp = 1 Hz onroad recorder (interp health, live tuning), code_identity = boot + 10-min code snapshots, marks = your flagged moments.</div>

    <div id="logs-actions" style="display:flex;gap:10px;">
      <button id="mark-btn" onclick="markIssue()">⚑ Mark issue now</button>
      <button class="btn-secondary" id="logs-copy" onclick="copyLogs()" disabled>Copy</button>
      <button class="btn-secondary" id="logs-refresh" onclick="refreshLogs()">Refresh</button>
    </div>
    <div id="logs-status"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
  // ── Terminal ──────────────────────────────────────────────────────────────
  const term = new Terminal({
    theme: { background: '#111', foreground: '#ddd', cursor: '#e94560' },
    fontSize: 13,
    fontFamily: '"Cascadia Code", "Fira Code", monospace',
    cursorBlink: true,
    scrollback: 5000,
  });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal-container'));
  fitAddon.fit();
  window.addEventListener('resize', () => fitAddon.fit());

  // ── WebSocket ─────────────────────────────────────────────────────────────
  let ws = null;
  let reconnectTimer = null;

  function connect() {
    clearTimeout(reconnectTimer);
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}/ws`);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      const s = document.getElementById('conn-status');
      s.textContent = 'connected';
      s.className = 'on';
      sendResize();
    };
    ws.onmessage = (e) => {
      term.write(e.data instanceof ArrayBuffer ? new Uint8Array(e.data) : e.data);
    };
    ws.onclose = () => {
      const s = document.getElementById('conn-status');
      s.textContent = 'disconnected';
      s.className = 'off';
      reconnectTimer = setTimeout(connect, 3000);
    };
    ws.onerror = () => ws.close();
  }

  function sendResize() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const buf = new Uint8Array(5);
    buf[0] = 0xFF;
    buf[1] = term.cols & 0xFF;  buf[2] = (term.cols >> 8) & 0xFF;
    buf[3] = term.rows & 0xFF;  buf[4] = (term.rows >> 8) & 0xFF;
    ws.send(buf);
  }

  term.onData((data) => {
    if (ws && ws.readyState === WebSocket.OPEN)
      ws.send(new TextEncoder().encode(data));
  });
  term.onResize(sendResize);
  connect();

  // ── Flash modal ───────────────────────────────────────────────────────────
  let selectedBranch = null;

  function openFlashModal() {
    selectedBranch = null;
    document.getElementById('flash-confirm').disabled = true;
    document.getElementById('modal-status').textContent = '';
    document.getElementById('modal-status').className = '';
    document.getElementById('modal-overlay').classList.add('active');
    loadBranches();
  }

  function closeFlashModal() {
    document.getElementById('modal-overlay').classList.remove('active');
  }

  async function loadBranches() {
    const list = document.getElementById('branch-list');
    list.innerHTML = '<div class="branch-loading">Loading…</div>';
    try {
      const branches = await fetch('/api/branches').then(r => r.json());
      list.innerHTML = '';
      if (!branches.length) {
        list.innerHTML = '<div class="branch-loading">No branches found</div>';
        return;
      }
      for (const b of branches) {
        const item = document.createElement('div');
        item.className = 'branch-item';
        item.dataset.name = b.name;
        const date = b.date ? b.date.slice(0, 10) : '';
        item.innerHTML =
          `<span class="branch-name">${b.name}</span>` +
          (date ? `<span class="branch-date">${date}</span>` : '');
        item.addEventListener('click', () => selectBranch(b.name));
        list.appendChild(item);
      }
    } catch (e) {
      list.innerHTML = `<div class="branch-loading">Error: ${e.message}</div>`;
    }
  }

  function selectBranch(name) {
    selectedBranch = name;
    document.querySelectorAll('.branch-item').forEach(el => {
      el.classList.toggle('selected', el.dataset.name === name);
    });
    document.getElementById('flash-confirm').disabled = false;
  }

  async function doFlash() {
    if (!selectedBranch) return;
    const statusEl = document.getElementById('modal-status');
    const btn = document.getElementById('flash-confirm');
    btn.disabled = true;
    statusEl.textContent = `Flashing ${selectedBranch}…`;
    statusEl.className = '';
    try {
      const resp = await fetch('/api/flash', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ branch: selectedBranch }),
      });
      const data = await resp.json();
      if (resp.ok) {
        statusEl.textContent = 'Flashing — device will reboot shortly.';
        statusEl.className = 'ok';
        setTimeout(closeFlashModal, 3000);
      } else {
        statusEl.textContent = data.error || 'Flash failed';
        statusEl.className = 'err';
        btn.disabled = false;
      }
    } catch (e) {
      statusEl.textContent = e.message;
      statusEl.className = 'err';
      btn.disabled = false;
    }
  }

  // Close on backdrop tap
  document.getElementById('modal-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal-overlay')) closeFlashModal();
  });

  // ── Diagnostics modal ──────────────────────────────────────────────────────
  let lastDiag = null;

  function escHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function openDiagModal() {
    document.getElementById('diag-status').textContent = '';
    document.getElementById('diag-status').className = '';
    document.getElementById('diag-overlay').classList.add('active');
    runDiag();
  }

  function closeDiagModal() {
    document.getElementById('diag-overlay').classList.remove('active');
  }

  async function runDiag() {
    const list = document.getElementById('diag-list');
    const runBtn = document.getElementById('diag-run');
    const copyBtn = document.getElementById('diag-copy');
    const statusEl = document.getElementById('diag-status');
    runBtn.disabled = true;
    copyBtn.disabled = true;
    statusEl.textContent = '';
    statusEl.className = '';
    list.innerHTML = '<div class="branch-loading">Running checks…</div>';
    try {
      const data = await fetch('/api/diagnostics', { method: 'POST' }).then(r => r.json());
      if (data.error) throw new Error(data.error);
      lastDiag = data.checks;
      renderDiag(data.checks);
      const fails = data.checks.filter(c => c.level === 'fail').length;
      const warns = data.checks.filter(c => c.level === 'warn').length;
      statusEl.textContent = fails ? `${fails} failed · ${warns} warning(s)`
                           : warns ? `Critical checks passed · ${warns} warning(s)`
                                   : 'All checks passed ✓';
      statusEl.className = fails ? 'err' : 'ok';
      copyBtn.disabled = false;
    } catch (e) {
      list.innerHTML = `<div class="branch-loading">Error: ${escHtml(e.message)}</div>`;
    } finally {
      runBtn.disabled = false;
    }
  }

  function renderDiag(checks) {
    const list = document.getElementById('diag-list');
    list.innerHTML = '';
    for (const c of checks) {
      const row = document.createElement('div');
      row.className = 'diag-row';
      const out = (c.output || '').trim();
      row.innerHTML =
        '<div class="diag-head">' +
          `<span class="diag-pill ${c.level}">${c.level.toUpperCase()}</span>` +
          `<span class="diag-name">${escHtml(c.name)}</span>` +
          `<span class="diag-summary">${escHtml(c.summary || '')}</span>` +
        '</div>' +
        (out ? `<div class="diag-output"><span class="diag-cmd">$ ${escHtml(c.cmd)}</span>\n${escHtml(out)}</div>` : '');
      list.appendChild(row);
    }
  }

  function diagReport() {
    if (!lastDiag) return '';
    const lines = ['FunnyPilot Diagnostics', '======================'];
    for (const c of lastDiag) {
      lines.push(`[${c.level.toUpperCase()}] ${c.name}${c.summary ? ' — ' + c.summary : ''}`);
      lines.push(`  $ ${c.cmd}`);
      const out = (c.output || '').trim();
      if (out) for (const l of out.split('\n')) lines.push(`  ${l}`);
      lines.push('');
    }
    return lines.join('\n');
  }

  async function copyDiag() {
    const text = diagReport();
    const statusEl = document.getElementById('diag-status');
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (e) {
      // Fallback for non-secure (http) contexts where the clipboard API is blocked
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      document.body.removeChild(ta);
    }
    statusEl.textContent = ok ? 'Copied to clipboard ✓ — paste it back to Claude' : 'Copy failed — long-press the output to select';
    statusEl.className = ok ? 'ok' : 'err';
  }

  document.getElementById('diag-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('diag-overlay')) closeDiagModal();
  });

  // ── Triage logs modal (v3.2.7) ──────────────────────────────────────────
  let logsCurrentName = null;
  let logsCurrentText = '';

  function openLogsModal() {
    document.getElementById('logs-overlay').classList.add('active');
    refreshLogs();
  }
  function closeLogsModal() {
    document.getElementById('logs-overlay').classList.remove('active');
  }

  async function refreshLogs() {
    const filesEl = document.getElementById('logs-files');
    const statusEl = document.getElementById('logs-status');
    statusEl.textContent = '';
    statusEl.className = '';
    try {
      const data = await fetch('/api/logs').then(r => r.json());
      if (data.error) throw new Error(data.error);
      filesEl.innerHTML = '';
      if (!data.files.length) {
        filesEl.innerHTML = '<span class="branch-loading">No logs yet — drive once, then check back.</span>';
        return;
      }
      for (const f of data.files) {
        const b = document.createElement('button');
        b.className = 'log-file-btn' + (f.name === logsCurrentName ? ' selected' : '');
        b.textContent = `${f.name} (${(f.size / 1024).toFixed(0)}K)`;
        b.onclick = () => loadLog(f.name);
        filesEl.appendChild(b);
      }
      if (logsCurrentName && data.files.some(f => f.name === logsCurrentName)) loadLog(logsCurrentName);
    } catch (e) {
      filesEl.innerHTML = `<span class="branch-loading">Error: ${escHtml(e.message)}</span>`;
    }
  }

  async function loadLog(name) {
    logsCurrentName = name;
    const view = document.getElementById('logs-view');
    const copyBtn = document.getElementById('logs-copy');
    document.querySelectorAll('.log-file-btn').forEach(b => b.classList.toggle('selected', b.textContent.startsWith(name + ' ')));
    view.textContent = 'Loading…';
    copyBtn.disabled = true;
    try {
      const data = await fetch(`/api/logs/${encodeURIComponent(name)}?tail_kb=128`).then(r => r.json());
      if (data.error) throw new Error(data.error);
      logsCurrentText = data.text || '(empty)';
      view.textContent = (data.truncated ? `… (showing last 128K of ${(data.size / 1024).toFixed(0)}K)\n` : '') + logsCurrentText;
      view.scrollTop = view.scrollHeight;
      copyBtn.disabled = false;
    } catch (e) {
      view.textContent = 'Error: ' + e.message;
    }
  }

  async function copyLogs() {
    const header = `FunnyPilot triage log: ${logsCurrentName}\ncopied: ${new Date().toISOString()}\n---\n`;
    const text = header + logsCurrentText;
    const statusEl = document.getElementById('logs-status');
    let ok = false;
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { ok = document.execCommand('copy'); } catch (_) { ok = false; }
      document.body.removeChild(ta);
    }
    statusEl.textContent = ok ? 'Copied ✓ — paste it back to Claude' : 'Copy failed — long-press the log to select';
    statusEl.className = ok ? 'ok' : 'err';
  }

  async function markIssue() {
    const statusEl = document.getElementById('logs-status');
    const note = prompt('Optional note (what does it feel like right now?)') || '';
    try {
      const r = await fetch('/api/logs/mark', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ note }),
      }).then(r => r.json());
      if (r.error) throw new Error(r.error);
      statusEl.textContent = 'Marked ✓ — timestamp saved to marks.jsonl';
      statusEl.className = 'ok';
      refreshLogs();
    } catch (e) {
      statusEl.textContent = 'Mark failed: ' + e.message;
      statusEl.className = 'err';
    }
  }

  document.getElementById('logs-overlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('logs-overlay')) closeLogsModal();
  });
</script>
</body>
</html>
